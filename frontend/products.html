<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HM Sports - Shop All Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="products.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand logo" href="index.html">
                <img src="images/hmlogo.png" alt="HM Sports Logo" class="header-logo" width="70px">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="products.html">Shop</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="faq.html">FAQ</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <form class="d-flex search-bar" role="search">
                        <div class="input-group input-group-sm">
                            <input type="text" class="form-control" placeholder="Search products..." aria-label="Search">
                            <button class="btn" type="button">🔍</button>
                        </div>
                    </form>

                    <button class="btn btn-outline-dark btn-sm nav-action-btn position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
                        🛒 <span class="d-none d-md-inline">Cart</span>
                        <span class="cart-badge ms-1">0</span>
                    </button>

                    <div id="auth-nav-container">
                        <button class="btn btn-sm btn-dark nav-action-btn" data-bs-toggle="modal" data-bs-target="#authModal">
                            🔐 Login
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <section class="product-listing">
            <h2 class="text-center mb-4 fw-bold" id="page-title">All Products</h2>
            
            <!-- Category Filter Buttons -->
            <div class="d-flex flex-wrap justify-content-center gap-2 mb-4" id="category-filters">
                <button class="btn btn-dark category-filter-btn active" data-category="all">All</button>
                <button class="btn btn-outline-dark category-filter-btn" data-category="Cricket">🏏 Cricket</button>
                <button class="btn btn-outline-dark category-filter-btn" data-category="Football">⚽ Football</button>
                <button class="btn btn-outline-dark category-filter-btn" data-category="Basketball">🏀 Basketball</button>
                <button class="btn btn-outline-dark category-filter-btn" data-category="Running">🏃 Running</button>
                <button class="btn btn-outline-dark category-filter-btn" data-category="Yoga">🧘 Yoga</button>
            </div>

            <!-- Dynamic Products Grid Container -->
            <div class="row g-4" id="products-container">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">Loading products...</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- CART OFFCANVAS DRAWER -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title fw-bold" id="cartOffcanvasLabel">🛍️ Your Cart</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div class="flex-grow-1 overflow-auto pe-1" id="cart-items-container">
                <div class="text-center py-5 text-muted">
                    <div class="spinner-border text-success" role="status"></div>
                </div>
            </div>
            <div class="border-top pt-3 mt-auto">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-bold fs-5">Subtotal:</span>
                    <span class="fw-bold fs-4 text-success" id="cart-subtotal">Rs. 0</span>
                </div>
                <button class="btn btn-hm-primary w-100 py-2 fs-6 shadow-sm" id="cart-checkout-btn" disabled>
                    💳 Checkout with Stripe
                </button>
            </div>
        </div>
    </div>

    <!-- AUTHENTICATION MODAL -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="authModalLabel">HM Sports Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <ul class="nav nav-tabs nav-justified mb-4" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">Login</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">Sign Up</button>
                        </li>
                    </ul>
                    <div class="tab-content" id="authTabsContent">
                        <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                            <form id="login-form">
                                <div class="alert alert-danger d-none py-2" id="login-error-msg"></div>
                                <div class="mb-3">
                                    <label for="login-email" class="form-label fw-bold">Email address</label>
                                    <input type="email" class="form-control" id="login-email" required placeholder="name@example.com">
                                </div>
                                <div class="mb-3">
                                    <label for="login-password" class="form-label fw-bold">Password</label>
                                    <input type="password" class="form-control" id="login-password" required placeholder="••••••••">
                                </div>
                                <button type="submit" class="btn btn-hm-primary w-100 py-2">Login</button>
                            </form>
                        </div>
                        <div class="tab-pane fade" id="register-panel" role="tabpanel">
                            <form id="register-form">
                                <div class="alert alert-danger d-none py-2" id="register-error-msg"></div>
                                <div class="mb-2">
                                    <label for="reg-name" class="form-label fw-bold">Full Name</label>
                                    <input type="text" class="form-control" id="reg-name" required placeholder="John Doe">
                                </div>
                                <div class="mb-2">
                                    <label for="reg-email" class="form-label fw-bold">Email address</label>
                                    <input type="email" class="form-control" id="reg-email" required placeholder="john@example.com">
                                </div>
                                <div class="mb-2">
                                    <label for="reg-password" class="form-label fw-bold">Password</label>
                                    <input type="password" class="form-control" id="reg-password" minlength="6" required placeholder="At least 6 characters">
                                </div>
                                <div class="mb-3">
                                    <label for="reg-phone" class="form-label fw-bold">Phone Number</label>
                                    <input type="tel" class="form-control" id="reg-phone" required placeholder="03001234567">
                                </div>
                                <button type="submit" class="btn btn-hm-accent w-100 py-2">Create Customer Account</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SHIPPING & DELIVERY DETAILS MODAL -->
    <div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold" id="checkoutModalLabel">🚚 Shipping & Delivery Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="alert alert-info py-2 small mb-3">
                        🔒 You are checking out as <strong id="checkout-user-display"></strong>. Your receipt will be linked to this account.
                    </div>
                    <form id="shipping-details-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">ACCOUNT EMAIL (Locked)</label>
                            <input type="email" class="form-control bg-light" id="ship-email" readonly disabled>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-bold small">Recipient Name *</label>
                                <input type="text" class="form-control" id="ship-name" required placeholder="Full Name">
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold small">Phone Number *</label>
                                <input type="tel" class="form-control" id="ship-phone" required placeholder="03001234567">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Delivery Address *</label>
                            <textarea class="form-control" id="ship-address" rows="2" required placeholder="House / Flat #, Street, Sector / Area"></textarea>
                        </div>
                        <div class="row g-2 mb-4">
                            <div class="col-7">
                                <label class="form-label fw-bold small">City *</label>
                                <input type="text" class="form-control" id="ship-city" required placeholder="e.g. Islamabad, Lahore">
                            </div>
                            <div class="col-5">
                                <label class="form-label fw-bold small">Postal Code</label>
                                <input type="text" class="form-control" id="ship-postal" placeholder="e.g. 44000">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-hm-primary w-100 py-2 fs-6 fw-bold shadow-sm" id="proceed-stripe-btn">
                            💳 Proceed to Stripe Payment
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-5">
        <p>&copy; 2025 HM Sports. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
